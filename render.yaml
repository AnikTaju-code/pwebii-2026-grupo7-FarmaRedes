services:
  - type: web
    name: farmarede-api-grupo7
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_MODE
        value: demo
      - key: FRONTEND_ORIGIN
        value: https://aniktaju-code.github.io
      - key: DATA_DIR
        value: /var/data
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
    disk:
      name: farmarede-data
      mountPath: /var/data
      sizeGB: 1
