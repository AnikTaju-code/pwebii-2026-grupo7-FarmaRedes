services:
  - type: web
    name: farmarede-api-grupo7
    runtime: node
    plan: free
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_MODE
        value: demo
      - key: FRONTEND_ORIGIN
        value: https://aniktaju-code.github.io
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false